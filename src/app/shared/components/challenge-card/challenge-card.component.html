<div class="bg-white rounded-2xl p-6 shadow-custom hover:shadow-custom-lg transition-all border-2 border-gray-300 hover:border-primary/50 group h-full flex flex-col">
  
  <!-- Header -->
  <div class="flex items-start justify-between mb-4">
    <app-badge [variant]="'difficulty'" [difficulty]="challenge.difficulty">
      {{ challenge.difficulty }}
    </app-badge>
    
    <!-- Points -->
    <div class="flex items-center gap-1 text-sunny">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
      <span class="font-semibold text-gray-900">{{ challenge.points }}</span>
    </div>
  </div>

  <!-- Content -->
  <h3 class="text-xl font-semibold text-gray-900 mb-2 group-hover:text-primary transition-colors">
    {{ challenge.title }}
  </h3>
  <p class="text-gray-600 mb-4 leading-relaxed flex-grow">
    {{ challenge.description }}
  </p>

  <!-- Progress Bar (Optional) -->
  <div *ngIf="challenge.progress !== undefined" class="mb-4">
    <div class="flex justify-between text-sm mb-2">
      <span class="text-gray-600">Progress</span>
      <span class="text-mint-dark font-medium">{{ challenge.progress }}%</span>
    </div>
    <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
      <div class="h-full bg-gradient-to-r from-mint to-mint-dark rounded-full transition-all" 
           [style.width.%]="challenge.progress"></div>
    </div>
  </div>

  <!-- Category Badge -->
  <div class="mb-4">
    <span class="inline-flex items-center px-3 py-1.5 rounded-lg bg-gray-100 text-gray-900 text-xs font-medium">
      📚 {{ challenge.category }}
    </span>
  </div>

  <!-- Footer -->
  <div class="flex items-center justify-between pt-4 border-t border-gray-300 mt-auto">
    <!-- Participants -->
    <div class="flex items-center gap-2 text-gray-600">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      <span class="text-sm">{{ challenge.participants }} participants</span>
    </div>
    
    <!-- CTA Button -->
    <button type="button" 
            (click)="onJoinChallenge()"
            class="px-5 py-2.5 rounded-xl bg-primary text-white font-medium hover:bg-primary-dark transition-all text-sm shadow-lg shadow-primary/30 hover:shadow-xl">
      Join Challenge
    </button>
  </div>

</div>
