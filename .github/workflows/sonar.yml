name: SonarCloud Analysis

# Trigger workflow on PR to main branch
on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the PR code
      - uses: actions/checkout@v3

      # 2. Set up Java environment (adjust version if needed)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Cache SonarCloud dependencies (optional, speeds up builds)
      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      # 4. Run SonarCloud scanner
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectKey: challenge-org_challenge-template   # replace with your org/repo key
          organization: challenge-org                     # replace with your org name
          token: ${{ secrets.SONAR_TOKEN }}             # uses the secret you added

